<style>
:root{
  --navy:#0F1E33; --navy-2:#172A48; --gold:#C7AB72; --gold-text:#87692F;

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;background:var(--surface);box-shadow:0 0 40px rgba(15,30,51,.08)}
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 40px) max(24px,env(safe-area-inset-right,0px)) 36px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.logo{display:flex;align-items:center;gap:12px}
.mark{width:52px;height:52px;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:500;font-size:28px;color:var(--gold)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1;letter-spacing:.02em}
.brand span{font-family:var(--f-latin);font-weight:600;font-size:14px;letter-spacing:.32em;color:var(--gold)}
.rule{width:32px;height:1px;background:var(--gold)}
.slogan{font-family:var(--f-display);font-size:15px;letter-spacing:.08em;color:#D9DEE7;margin:0}
.person{padding:28px 24px 8px;display:flex;align-items:baseline;justify-content:center;gap:8px}
.person b{font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:.06em}
.person span{font-size:15px;color:var(--muted)}
.person-en{text-align:center;font-family:var(--f-latin);font-weight:600;font-size:14px;letter-spacing:.16em;color:var(--gold-text);margin:0 0 22px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 20px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600;border-radius:4px;cursor:pointer;font-family:inherit}
.act svg{width:20px;height:20px;flex-shrink:0}
.act.primary{grid-column:1/-1;background:var(--navy);border-color:var(--navy);color:#fff;font-size:17px;min-height:60px}
.act.primary svg{color:var(--gold)}
.act.kakao{background:#FEE500;border-color:#FEE500;color:#191919}
.act:active{transform:scale(.98)}
.act:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.info{margin:26px 20px 0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.row dt{font-family:var(--f-latin);font-weight:600;font-size:14px;letter-spacing:.1em;color:var(--gold-text)}
.row dd{margin:0;font-size:15px;line-height:1.5}
.row dd strong{font-weight:600}
.mini{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:500;padding:8px 12px;border-radius:4px;text-decoration:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.svc{margin:26px 20px 0}
.svc h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{font-size:14px;padding:8px 12px;background:var(--paper);border-radius:999px;color:var(--ink)}
.area{margin:14px 0 0;font-size:14px;color:var(--muted)}
.foot{margin-top:30px;padding:24px 20px calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.foot a{color:var(--gold-text)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
